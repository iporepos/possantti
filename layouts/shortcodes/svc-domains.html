<span class="svc-label">{{ i18n "svc_label_domains" }}</span>
<div class="svc-domains">
  {{ range .Page.Params.svc.domains }}
  <div class="svc-domain">
    <span class="svc-domain-icon">{{ .icon }}</span>
    <span class="svc-domain-title">{{ .title }}</span>
    <p class="svc-domain-desc">{{ .desc }}</p>
  </div>
  {{ end }}
</div>
