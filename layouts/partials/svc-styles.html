<style>
/* ── Services page — structural CSS, no visual overrides ── */

.svc-page {
  max-width: calc(890px - (30px * 2));
  margin-right: auto;
  margin-left: auto;
  padding-right: 30px;
  padding-left: 30px;
  font-family: 'Source Sans 3', sans-serif;
}

.svc-hero-desc,
.svc-domain-desc,
.svc-tagline,
.svc-wf-desc,
.svc-cta-desc,
.svc-bullets li {
  font-family: 'Source Serif 4', serif;
}

.svc-hero {
  padding: 3rem 0 2.5rem;
  border-bottom: 1px solid currentColor;
  margin-bottom: 0;
}
.svc-eyebrow {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-bottom: 1rem;
}
.svc-hero-title { margin-bottom: 1.2rem; }
.svc-hero-desc {
  max-width: 560px;
  margin-bottom: 2rem;
}
.svc-pills { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.svc-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.svc-pill::before {
  content: '';
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.45;
  flex-shrink: 0;
}

.svc-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin: 3rem 0 1rem;
}

/* Color coding — transparent tints, dark/light safe */
.svc-domain  { background: rgba(59, 130, 246, 0.07); }
.svc-card    { background: rgba(139, 92, 246, 0.06); }
.svc-workflow,
.svc-setting { background: rgba(16, 185, 129, 0.06); }

/* Domain tiles */
.svc-domains {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  border: 1px solid currentColor;
  border-radius: 4px;
  overflow: hidden;
}
.svc-domain { padding: 1.4rem 1.2rem; }
.svc-domain-icon { font-size: 1.2rem; display: block; margin-bottom: 0.6rem; }
.svc-domain-title {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}
.svc-domain-desc { font-size: 0.82rem; line-height: 1.55; margin: 0; }

/* Service cards */
.svc-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  border: 1px solid currentColor;
  border-radius: 4px;
  overflow: hidden;
}
.svc-card {
  padding: 1.8rem 1.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.svc-card-header { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
.svc-tag {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid rgba(139, 92, 246, 0.5);
  border-radius: 2px;
  padding: 1px 5px;
  background: rgba(139, 92, 246, 0.18);
  white-space: nowrap;
  flex-shrink: 0;
}
.svc-card-name { font-weight: 600; }
.svc-tagline { font-size: 0.85rem; font-style: italic; margin: 0; }
.svc-divider { height: 1px; background: currentColor; opacity: 0.12; }
.svc-bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.svc-bullets li {
  font-size: 0.82rem;
  padding-left: 1rem;
  position: relative;
  line-height: 1.5;
}
.svc-bullets li::before {
  content: '—';
  position: absolute;
  left: 0;
  opacity: 0.4;
  font-size: 0.7rem;
  top: 3px;
}

/* Workflow strip */
.svc-workflow {
  border: 1px solid currentColor;
  border-radius: 4px 4px 0 0;
  padding: 1.8rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.svc-wf-item { padding: 0 1.2rem; border-right: 1px solid currentColor; }
.svc-wf-item:first-child { padding-left: 0; }
.svc-wf-item:last-child { border-right: none; }
.svc-wf-type {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid rgba(16, 185, 129, 0.5);
  border-radius: 2px;
  padding: 1px 5px;
  background: rgba(16, 185, 129, 0.18);
  margin-bottom: 0.5rem;
}
.svc-wf-name { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem; }
.svc-wf-desc { font-size: 0.8rem; line-height: 1.5; margin: 0; }

/* Setting bar — flush under workflow */
.svc-setting {
  display: flex;
  align-items: center;
  gap: 2rem;
  padding: 1rem 1.4rem;
  border: 1px solid currentColor;
  border-top: none;
  border-radius: 0 0 4px 4px;
  flex-wrap: wrap;
}
.svc-setting-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
.svc-setting-item strong { font-weight: 600; }
.svc-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.4; flex-shrink: 0; }

/* CTA */
.svc-cta {
  border-top: 1px solid currentColor;
  margin-top: 3rem;
  padding-top: 2.5rem;
}
.svc-cta-desc { font-size: 0.85rem; max-width: 360px; margin-top: 0.4rem; }
.svc-cta-actions { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; margin-top: 1.2rem; }
.svc-cta-email {
  border: 1px solid currentColor;
  border-radius: 3px;
  padding: 0.5rem 1rem;
  font-size: 0.9rem;
  font-weight: 500;
  display: inline-block;
  transition: opacity 0.15s;
  text-decoration: none;
}
.svc-cta-email:hover { text-decoration: none; }
.svc-cta-links { display: flex; gap: 0.8rem; font-size: 0.75rem; }

/* Legal */
.svc-legal {
  margin-top: 1.5rem;
  padding: 1rem 1.2rem;
  border: 1px solid currentColor;
  border-radius: 4px;
  display: flex;
  gap: 2.5rem;
  flex-wrap: wrap;
  align-items: center;
}
.svc-legal-item { font-size: 0.75rem; line-height: 1.55; }
.svc-legal-item strong {
  display: block;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.15rem;
}

/* Responsive */
@media (max-width: 768px) {
  .svc-page {
    padding-right: 20px;
    padding-left: 20px;
  }
}
@media (max-width: 680px) {
  .svc-domains  { grid-template-columns: 1fr; }
  .svc-cards    { grid-template-columns: 1fr; }
  .svc-workflow { grid-template-columns: 1fr; gap: 1.2rem; padding: 1.2rem; border-radius: 4px 4px 0 0; }
  .svc-wf-item  { border-right: none; border-bottom: 1px solid currentColor; padding: 0 0 1.2rem; }
  .svc-wf-item:last-child { border-bottom: none; padding-bottom: 0; }
  .svc-cta-actions { align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .svc-cta-email { transition: none; }
}
</style>
